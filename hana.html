<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff4f7">
<title>Hana | COSMETIC KORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#e8799b;--ink:#30252b;--muted:#8d7d84;--line:#f2e4e9}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff6f8,#fff 55%,#fff0f5);color:var(--ink);font-family:"Noto Sans Arabic","Plus Jakarta Sans",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.app{width:min(100%,520px);height:min(900px,calc(100vh - 32px));min-height:560px;background:#fff;border:1px solid #f5e5eb;border-radius:28px;box-shadow:0 18px 60px #96536b22;display:flex;flex-direction:column;overflow:hidden}
header{padding:18px 20px 15px;background:linear-gradient(120deg,#fff,#fff3f7);border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:17px;background:linear-gradient(135deg,#ed8eaa,#f7c0ce);display:grid;place-items:center;color:white;font-size:24px}.brand{flex:1}.brand h1{font-size:19px;margin:0;font-weight:800}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}.status{font-size:11px;color:#4e9a76;display:flex;align-items:center;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#5ab889}.langs{display:flex;gap:7px;margin-top:15px}.lang{border:1px solid var(--line);background:white;color:var(--muted);padding:7px 13px;border-radius:20px;font:600 11px inherit;cursor:pointer}.lang.active{background:#fce7ee;border-color:#f4c3d2;color:#a94d6c}
main{flex:1;overflow:auto;padding:18px 15px;display:flex;flex-direction:column;gap:13px}.welcome{background:linear-gradient(135deg,#fff5f8,#fff);border:1px solid var(--line);padding:15px;border-radius:19px;line-height:1.9;font-size:13px}.welcome strong{color:#b75b7a}.quick{display:flex;flex-wrap:wrap;gap:7px}.quick button{border:1px solid #f0dce4;background:#fff;color:#9b5b72;border-radius:18px;padding:8px 11px;font:500 11px inherit;cursor:pointer}.msg{max-width:88%;padding:11px 14px;border-radius:18px;font-size:13px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.msg.bot{align-self:flex-start;background:#fff1f5;border:1px solid #f5e2e9;border-bottom-right-radius:5px}.msg.user{align-self:flex-end;background:linear-gradient(135deg,#e98ba8,#d96f91);color:white;border-bottom-left-radius:5px}.typing{color:var(--muted);font-size:12px;padding:5px 12px}
footer{padding:12px 13px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}.disclaimer{text-align:center;color:#a29399;font-size:10px;margin:0 0 9px}.composer{display:flex;align-items:flex-end;gap:8px;background:#fff7f9;border:1px solid #f0dfe6;border-radius:22px;padding:7px}textarea{flex:1;resize:none;border:0;outline:0;background:transparent;max-height:110px;min-height:38px;padding:9px 7px;font:13px inherit;color:var(--ink);line-height:1.6}textarea::placeholder{color:#b6a6ac}.send{width:42px;height:42px;border:0;border-radius:15px;background:linear-gradient(135deg,#ed91ad,#d96f91);color:white;font-size:18px;cursor:pointer;flex-shrink:0}.send:disabled{opacity:.5}@media(max-width:420px){body{padding:0}.app{height:100dvh;min-height:0;border-radius:0;border:0}.msg{max-width:92%}}
</style>
</head>
<body>
<div class="app">
<header><div class="top"><div class="logo">✿</div><div class="brand"><h1>Hana Beauty Advisor</h1><p>COSMETIC KORE · Your beauty assistant</p></div><div class="status"><span class="dot"></span><span id="statusText">ئامادەیە</span></div></div>
<div class="langs"><button class="lang active" data-lang="ckb">کوردی</button><button class="lang" data-lang="ar">العربية</button><button class="lang" data-lang="en">English</button></div></header>
<main id="chat"><div class="welcome" id="welcome"><strong>بەخێربێیت بۆ COSMETIC KORE 🌸</strong><br>من هانا‌م، یاریدەدەری جوانی و چاودێری پێستم. دەتوانیت پرسیارم لەبارەی ڕۆتینی پێست، بەرهەمەکان و شێوازی بەکارهێنانیان بکەیت.</div><div class="quick" id="quick"><button data-prompt="ڕۆتینی پێستی وشکم بۆ دابنێ">ڕۆتینی پێست</button><button data-prompt="چۆن واقی لە خۆر بەکاربهێنم؟">پاراستن لە خۆر</button><button data-prompt="بۆ پێستی هەستیار چی باشە؟">پێستی هەستیار</button></div></main>
<footer><p class="disclaimer" id="disclaimer">هانا ڕاوێژی گشتی دەدات؛ بۆ کێشەی پزیشکی پێست پزیشک ببینە.</p><div class="composer"><textarea id="message" rows="1" placeholder="پرسیارەکەت بنووسە..."></textarea><button class="send" id="send" aria-label="Send">➤</button></div></footer>
</div>
<script>
const API_URL="https://damp-union-a8d0.ozanshallaw6.workers.dev";
const chat=document.getElementById("chat"),input=document.getElementById("message"),sendButton=document.getElementById("send"),statusText=document.getElementById("statusText");
let language="ckb",history=[];
const words={
ckb:{welcome:'<strong>بەخێربێیت بۆ COSMETIC KORE 🌸</strong><br>من هانا‌م، یاریدەدەری جوانی و چاودێری پێستم. دەتوانیت پرسیارم لەبارەی ڕۆتینی پێست، بەرهەمەکان و شێوازی بەکارهێنانیان بکەیت.',placeholder:'پرسیارەکەت بنووسە...',disclaimer:'هانا ڕاوێژی گشتی دەدات؛ بۆ کێشەی پزیشکی پێست پزیشک ببینە.',ready:'ئامادەیە',typing:'هانا وەڵام ئامادە دەکات...',error:'ببورە، ئێستا پەیوەندی بە یاریدەدەری زیرەکەوە سەرکەوتوو نەبوو. تکایە دووبارە هەوڵ بدەرەوە.',quick:[['ڕۆتینی پێستی وشکم بۆ دابنێ','ڕۆتینی پێست'],['چۆن واقی لە خۆر بەکاربهێنم؟','پاراستن لە خۆر'],['بۆ پێستی هەستیار چی باشە؟','پێستی هەستیار']]},
ar:{welcome:'<strong>أهلاً بيك في COSMETIC KORE 🌸</strong><br>أنا هانا، مساعدتك للعناية بالبشرة والجمال. اسأليني عن الروتين والمنتجات وطريقة استخدامها.',placeholder:'اكتبي سؤالك هنا...',disclaimer:'هانا تقدم معلومات عامة؛ للمشاكل الجلدية راجعي طبيب جلدية.',ready:'متاحة',typing:'هانا تحضّر الإجابة...',error:'عذراً، لم أتمكن من الاتصال بالمساعد حالياً. حاولي مرة ثانية.',quick:[['اعملي لي روتين للبشرة الجافة','روتين البشرة'],['شلون أستخدم واقي الشمس؟','واقي الشمس'],['شنو يناسب البشرة الحساسة؟','البشرة الحساسة']]},
en:{welcome:'<strong>Welcome to COSMETIC KORE 🌸</strong><br>I’m Hana, your beauty and skincare assistant. Ask me about skincare routines, products, and how to use them.',placeholder:'Type your question...',disclaimer:'Hana provides general information. Consult a dermatologist for medical skin concerns.',ready:'Ready',typing:'Hana is preparing an answer...',error:'Sorry, I could not connect to the assistant. Please try again.',quick:[['Create a routine for dry skin','Skincare routine'],['How do I use sunscreen?','Sun protection'],['What is suitable for sensitive skin?','Sensitive skin']]}
};
function addMessage(role,text){const el=document.createElement('div');el.className='msg '+role;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;}
function setLanguage(lang){language=lang;history=[];document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));document.getElementById('welcome').innerHTML=words[lang].welcome;document.getElementById('disclaimer').textContent=words[lang].disclaimer;input.placeholder=words[lang].placeholder;statusText.textContent=words[lang].ready;const q=document.getElementById('quick');q.innerHTML='';words[lang].quick.forEach(([prompt,label])=>{const b=document.createElement('button');b.textContent=label;b.addEventListener('click',()=>sendMessage(prompt));q.appendChild(b);});}
document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
document.getElementById('quick').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>sendMessage(b.dataset.prompt)));
async function sendMessage(text){text=text.trim();if(!text||sendButton.disabled)return;addMessage('user',text);input.value='';input.style.height='auto';sendButton.disabled=true;statusText.textContent=words[language].typing;const typing=document.createElement('div');typing.className='typing';typing.textContent=words[language].typing;chat.appendChild(typing);chat.scrollTop=chat.scrollHeight;
try{const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history.slice(-10)})});const data=await response.json();if(!response.ok||!data.reply)throw new Error(data.error||'Request failed');history.push({role:'user',text:text},{role:'model',text:data.reply});history=history.slice(-10);typing.remove();addMessage('bot',data.reply);}
catch(error){typing.remove();addMessage('bot',words[language].error);console.error(error);}
finally{sendButton.disabled=false;statusText.textContent=words[language].ready;input.focus();}}
sendButton.addEventListener('click',()=>sendMessage(input.value));input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px';});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(input.value);}});setLanguage('ckb');
</script>
</body></html>
