<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COSMETIC KORE - Hana Beauty Advisor</title>
    <!-- Google Fonts: Inter & Noto Sans Arabic for Kurdish Sorani and Iraqi Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff6b8b;
            --secondary-pink: #ff8fab;
            --light-pink: #fff0f3;
            --soft-blush: #ffe5ec;
            --bubble-user: linear-gradient(135deg, #ff6b8b, #ff85a1);
            --bubble-bot: #ffffff;
            --text-dark: #2d2327;
            --text-muted: #8a7a82;
            --white: #ffffff;
            --shadow-subtle: 0 10px 25px -5px rgba(255, 107, 139, 0.12);
            --shadow-elevated: 0 15px 35px -5px rgba(255, 107, 139, 0.2);
            --radius-bubble: 20px;
            --app-max-width: 460px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #ffeef2 0%, #fff6f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
        }

        /* RTL typography overrides */
        body[dir="rtl"] {
            font-family: 'Noto Sans Arabic', sans-serif;
        }

        .chat-app-wrapper {
            width: 100%;
            max-width: var(--app-max-width);
            height: 100vh;
            background-color: var(--light-pink);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow-elevated);
            overflow: hidden;
        }

        @media (min-width: 480px) {
            .chat-app-wrapper {
                height: 92vh;
                border-radius: 36px;
                border: 8px solid rgba(255, 255, 255, 0.8);
            }
        }

        /* Header Styling */
        .chat-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 182, 193, 0.35);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 700;
            color: var(--primary-pink);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-selector {
            display: flex;
            background: var(--soft-blush);
            border-radius: 20px;
            padding: 3px;
            gap: 2px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 9px;
            border-radius: 14px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--white);
            color: var(--primary-pink);
            box-shadow: 0 2px 6px rgba(255, 107, 139, 0.2);
        }

        .assistant-profile {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar-container {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--primary-pink);
            padding: 2px;
            background: #fff;
            object-fit: cover;
        }

        .status-dot {
            width: 13px;
            height: 13px;
            background: #10b981;
            border-radius: 50%;
            position: absolute;
            bottom: 0px;
            right: 0px;
            border: 2px solid #ffffff;
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .assistant-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .assistant-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-korean {
            font-size: 10px;
            background: #ffe3ec;
            color: var(--primary-pink);
            padding: 2px 7px;
            border-radius: 8px;
            font-weight: 600;
        }

        .assistant-status {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Chat Body */
        .chat-body {
            flex: 1;
            padding: 20px 16px;
            overflow-y: auto;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-body::-webkit-scrollbar {
            width: 5px;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: #ffd3de;
            border-radius: 10px;
        }

        .message-row {
            display: flex;
            gap: 10px;
            max-width: 82%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.bot {
            align-self: flex-start;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .mini-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1.5px solid var(--secondary-pink);
            background: #fff;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bubble {
            padding: 13px 16px;
            font-size: 14.5px;
            line-height: 1.5;
            position: relative;
            word-break: break-word;
        }

        .bot .bubble {
            background: var(--bubble-bot);
            color: var(--text-dark);
            border-radius: var(--radius-bubble) var(--radius-bubble) var(--radius-bubble) 4px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.2);
            border: 1px solid rgba(255, 182, 193, 0.25);
        }

        [dir="rtl"] .bot .bubble {
            border-radius: var(--radius-bubble) var(--radius-bubble) 4px var(--radius-bubble);
        }

        .user .bubble {
            background: var(--bubble-user);
            color: #ffffff;
            border-radius: var(--radius-bubble) var(--radius-bubble) 4px var(--radius-bubble);
            box-shadow: 0 6px 16px rgba(255, 107, 139, 0.28);
        }

        [dir="rtl"] .user .bubble {
            border-radius: var(--radius-bubble) var(--radius-bubble) var(--radius-bubble) 4px;
        }

        .timestamp {
            font-size: 10.5px;
            color: #a4949b;
            padding: 0 4px;
        }

        .user .timestamp {
            text-align: right;
        }

        [dir="rtl"] .user .timestamp {
            text-align: left;
        }

        /* Typing Dots */
        .typing-bubble {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 18px;
            width: fit-content;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--primary-pink);
            border-radius: 50%;
            opacity: 0.6;
            animation: bounce 1.3s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Quick Replies Horizontal Scroller */
        .quick-replies-container {
            padding: 6px 14px 10px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .quick-replies-container::-webkit-scrollbar {
            display: none;
        }

        .quick-reply-pill {
            background: rgba(255, 255, 255, 0.95);
            color: var(--primary-pink);
            border: 1.5px solid #ffc2d1;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255, 182, 193, 0.18);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .quick-reply-pill:active, .quick-reply-pill:hover {
            background: var(--primary-pink);
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* Input Controls */
        .chat-input-area {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 12px 16px 18px;
            border-top: 1px solid rgba(255, 182, 193, 0.35);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            background: #fff5f8;
            border: 1.5px solid #ffd0dc;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 4px 14px;
            transition: border-color 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 3px rgba(255, 107, 139, 0.15);
        }

        .text-input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 14.5px;
            outline: none;
            color: var(--text-dark);
            font-family: inherit;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bubble-user);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 107, 139, 0.35);
            transition: transform 0.2s, background 0.2s;
            flex-shrink: 0;
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        .send-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        [dir="rtl"] .send-icon {
            transform: rotate(180deg);
        }
    </style>
</head>

        </header>

        <!-- Chat Log -->
        <section class="chat-body" id="chatBody" aria-live="polite">
            <!-- Messages will be rendered here dynamically -->

        <!-- Quick Replies Bar -->
        <nav class="quick-replies-container" id="quickReplies" aria-label="Suggested questions">

                    "acne": "لعلاج حب الشباب وآثاره 🌿:\nمجموعة Some By Mi المعجزة (AHA BHA PHA) أو سيروم الحلزون مع النياسيناميد من COSRX يرتب المسام ويصفي الحبوب بسرعة بدون تحسس.",
                    "moisturizer": "إذا بشرتج جافة: مرطب سون جونغ SoonJung 2x المنقذ 💧.\nإذا بشرتج دهنية أو مختلطة: مرطب توريدن Torriden المائي بحمض الهيالورونيك خفيف ويمتص بثواني!",
                    "sunscreen": "أفضل واقيات شمس كورية بالعراق ☀️:\nواقي بيوتي أوف جوسون بالرز (ترطيب ونضارة تجنن) أو سكن 1004 سنتيلا المائي (خفيف مثل السيروم وما يترك أي أثر أبيض)!"
                }
            }
        };

        let currentLang = 'en';

        function setLanguage(lang) {
            currentLang = lang;
            const data = i18n[lang];

            // Direction and Fonts
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('dir', data.dir);
            document.body.setAttribute('dir', data.dir);

            // Active button state
            document.querySelectorAll('.lang-btn').forEach(btn => {
                const isSelected = (lang === 'ckb' && btn.innerText.includes('کوردی')) ||
                                   (lang === 'ar' && btn.innerText.includes('عراقي')) ||
                                   (lang === 'en' && btn.innerText.trim() === 'EN');
                btn.classList.toggle('active', isSelected);
            });

            // Update UI static elements
            document.getElementById('hana-name').innerText = data.name;
            document.getElementById('hana-title').innerText = data.title;
            document.getElementById('messageInput').placeholder = data.placeholder;

            // Render Quick Replies
            renderQuickReplies();

            // Clear chat and add localized welcome
            const chatBody = document.getElementById('chatBody');
            chatBody.innerHTML = '';
            appendMessage('bot', data.welcome);
        }

        function renderQuickReplies() {
            const container = document.getElementById('quickReplies');
            container.innerHTML = '';
            i18n[currentLang].quickReplies.forEach(qr => {
                const btn = document.createElement('button');
                btn.className = 'quick-reply-pill';
                btn.innerText = qr.label;
                btn.onclick = () => {
                    sendMessage(qr.label, qr.query);
                };
                container.appendChild(btn);
            });
        }

        function getCurrentTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${hours}:${minutes} ${ampm}`;
        }

        function appendMessage(sender, text) {
            const chatBody = document.getElementById('chatBody');
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            const avatarSvg = sender === 'bot' ? `
                <svg class="mini-avatar" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="48" fill="#ffe5ec"/>
                    <circle cx="50" cy="45" r="22" fill="#ffd0dc"/>
                    <circle cx="43" cy="45" r="3" fill="#2d2327"/>
                    <circle cx="57" cy="45" r="3" fill="#2d2327"/>
                    <path d="M47,53 Q50,56 53,53" stroke="#e05769" stroke-width="2" fill="none"/>
                </svg>` : '';

            row.innerHTML = `
                ${avatarSvg}
                <div class="message-content">
                    <div class="bubble">${text.replace(/\n/g, '<br>')}</div>
                    <span class="timestamp">${getCurrentTime()}</span>
                </div>
            `;

            chatBody.appendChild(row);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showTypingIndicator() {
            const chatBody = document.getElementById('chatBody');
            const typingRow = document.createElement('div');
            typingRow.className = 'message-row bot typing-indicator-row';
            typingRow.id = 'typingIndicator';
            typingRow.innerHTML = `
                <svg class="mini-avatar" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="48" fill="#ffe5ec"/>
                    <circle cx="50" cy="45" r="22" fill="#ffd0dc"/>
                </svg>
                <div class="message-content">
                    <div class="bubble typing-bubble">
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                    </div>
                </div>
            `;
            chatBody.appendChild(typingRow);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function removeTypingIndicator() {
            const elem = document.getElementById('typingIndicator');
            if (elem) elem.remove();
        }

        function generateBotResponse(userInput, predefinedKey = null) {
            const currentResponses = i18n[currentLang].responses;
            const input = (userInput || '').toLowerCase();

            if (predefinedKey && currentResponses[predefinedKey]) {
                return currentResponses[predefinedKey];
            }

            // Keyword detection
            if (input.includes('glass') || input.includes('نضار') || input.includes('شوشەیی') || input.includes('glow')) {
                return currentResponses["glass skin"];
            } else if (input.includes('acne') || input.includes('حب') || input.includes('زیپکە') || input.includes('حبوب')) {
                return currentResponses["acne"];
            } else if (input.includes('moist') || input.includes('مرطب') || input.includes('شێدار') || input.includes('dry')) {
                return currentResponses["moisturizer"];
            } else if (input.includes('sun') || input.includes('واقي') || input.includes('خۆر') || input.includes('شمس')) {
                return currentResponses["sunscreen"];
            }

            return currentResponses.default;
        }

        function sendMessage(displayText, intentKey = null) {
            appendMessage('user', displayText);
            showTypingIndicator();

            // Simulate natural Hana typing delay (700ms - 1100ms)
            setTimeout(() => {
                removeTypingIndicator();
                const reply = generateBotResponse(displayText, intentKey);
                appendMessage('bot', reply);
            }, 850);
        }

        function handleSendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            sendMessage(text);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        }

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', () => {
            setLanguage('en');
        });
    </script>
</body>
</html>
